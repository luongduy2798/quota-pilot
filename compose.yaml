services:
  quota-pilot:
    build: .
    env_file: .env
    environment:
      PORT: 8788
      DB_PATH: /data/quota-pilot.sqlite
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - quota-pilot-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    profiles: ["tunnel"]
    restart: unless-stopped
    user: "${QUOTA_PILOT_UID:-1000}:${QUOTA_PILOT_GID:-1000}"
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "--metrics", "127.0.0.1:20241", "run"]
    volumes:
      - type: bind
        source: ./deploy/cloudflared.yml
        target: /etc/cloudflared/config.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/cloudflared-credentials.json
        target: /etc/cloudflared/credentials.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      quota-pilot:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  quota-pilot-data:
